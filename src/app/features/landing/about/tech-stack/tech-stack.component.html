<div class="tech-stack">
  <div class="tech-stack__panel">
    <div class="tech-stack__header">
      <div class="tech-stack__header-left">
        <span class="material-symbols-outlined tech-stack__header-icon">memory</span>
        <h3 class="tech-stack__title">Tech Stack Arsenal</h3>
      </div>
      <span class="tech-stack__badge-count">v2.5 // PRODUCTION READY</span>
    </div>

    <div class="tech-stack__grid">
      @for (category of categories(); track category.title) {
        <div class="tech-stack__category">
          <h4 [class]="'tech-stack__category-title tech-stack__category-title--' + category.tone">
            {{ category.title }}
          </h4>
          <div class="tech-stack__badges">
            @for (badge of category.badges; track badge; let index = $index) {
              <span
                [class]="
                  'tech-stack__badge ' + badgeToneClass(category, index)
                "
              >
                {{ badge }}
              </span>
            }
          </div>
        </div>
      }
    </div>
  </div>
</div>
