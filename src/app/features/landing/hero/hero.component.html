<section class="hero" id="inicio">
  <!-- Layer 1: Background Scene (Escenario) -->
  <div class="hero__artwork hero__artwork--bg">
    <img
      alt="Cosmic storm and floating rocks background"
      class="hero__artwork-image hero__artwork-image--bg"
      ngSrc="assets/shared/hero-escenario.webp"
      fill
      priority
    />
    <div class="hero__artwork-overlay"></div>
  </div>

  <!-- Layer 2: Foreground Character (Cuerpo - Desktop/Tablet) -->
  <div class="hero__artwork hero__artwork--body">
    <img
      alt="Anime character floating in foreground"
      class="hero__artwork-image hero__artwork-image--body"
      ngSrc="assets/shared/cuerpo_Sin_fondo.webp"
      fill
      priority
    />
    <div class="hero__error-glow">ERROR_04</div>
  </div>

  <div class="hero__noise"></div>

  <!-- Content Layer -->
  <div class="hero__container">
    <div class="hero__intro">
      <div class="hero__headline">
        <h1 class="hero__title">
          HOLA, MI NOMBRE ES
          <span class="hero__name">KEVIN SÁNCHEZ</span>
        </h1>
      </div>

      <div class="hero__bio">
        <p class="hero__role">DESARROLLADOR FULL-STACK | .NET & ANGULAR</p>
        <p class="hero__summary">
          ENFOCADO EN EL CICLO DE VIDA DEL SOFTWARE, LA GESTIÓN DE BASES DE DATOS SQL Y EL DESPLIEGUE DE APLICACIONES.
        </p>
      </div>

      <div class="hero__cta">
        <button
          type="button"
          class="hero__cta-link cursor-pointer"
          (click)="goToProjects($event)"
        >
          <span class="material-symbols-outlined hero__cta-icon">grid_view</span>
          <span>VER PROYECTOS</span>
          <span class="material-symbols-outlined hero__cta-arrow">arrow_forward</span>
        </button>
        <a
          href="Kevin_Sanchez_CV.pdf"
          target="_blank"
          rel="noopener noreferrer"
          class="hero__cta-link hero__cta-link--cv cursor-pointer"
          title="Ver Currículum Vitae (PDF)"
        >
          <span class="material-symbols-outlined hero__cta-icon">description</span>
          <span>VER CV (PDF)</span>
          <span class="material-symbols-outlined hero__cta-arrow">open_in_new</span>
        </a>
      </div>
    </div>
  </div>
</section>
