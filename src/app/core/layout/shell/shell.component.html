<!-- Global shell keeps navigation persistent across routes. -->
@if (isLoading()) {
  <app-loading-sketch />
}

@if (!isLoading()) {
  @if (!isDetailRoute()) {
    <app-top-nav />
  }
  <main [class.pt-20]="!isDetailRoute()">
    <!-- Feature routes render here. -->
    <router-outlet />
  </main>
}
