<!-- Game-menu style section switching navigation -->
<nav class="top-nav">
  <div class="top-nav__container">
    <div class="top-nav__row">
      <div class="top-nav__brand" (click)="navigateTo('inicio', $event)" role="button" tabindex="0">
        <div class="top-nav__logo">
          <img
            alt="Logo Kevin"
            class="top-nav__logo-image"
            src="assets/shared/nav-logo.webp"
          />
        </div>
        <span class="top-nav__title">KOJI</span>
      </div>
      <div class="top-nav__links">
        <button
          type="button"
          class="top-nav__link"
          [class.top-nav__link--active]="activeSection() === 'inicio'"
          (click)="navigateTo('inicio', $event)"
        >
          Inicio
        </button>
        <button
          type="button"
          class="top-nav__link"
          [class.top-nav__link--active]="activeSection() === 'sobre-mi'"
          (click)="navigateTo('sobre-mi', $event)"
        >
          Sobre Mí
        </button>
        <button
          type="button"
          class="top-nav__link"
          [class.top-nav__link--active]="activeSection() === 'proyectos'"
          (click)="navigateTo('proyectos', $event)"
        >
          Proyectos
        </button>
      </div>
      <div class="top-nav__actions">
        <button
          class="top-nav__toggle"
          type="button"
          [attr.aria-label]="isDark() ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'"
          (click)="toggleTheme($event)"
        >
          <span class="material-symbols-outlined top-nav__toggle-icon">{{ isDark() ? 'light_mode' : 'dark_mode' }}</span>
        </button>
        <button
          class="top-nav__mobile-toggle"
          type="button"
          [attr.aria-label]="isMenuOpen() ? 'Cerrar menu' : 'Abrir menu'"
          (click)="toggleMenu()"
        >
          <span class="material-symbols-outlined top-nav__toggle-icon">{{ isMenuOpen() ? 'close' : 'menu' }}</span>
        </button>
      </div>

    </div>
  </div>
  @if (isMenuOpen()) {
    <div class="top-nav__panel">
      <button
        type="button"
        class="top-nav__panel-link"
        [class.top-nav__panel-link--active]="activeSection() === 'inicio'"
        (click)="navigateTo('inicio')"
      >
        Inicio
      </button>
      <button
        type="button"
        class="top-nav__panel-link"
        [class.top-nav__panel-link--active]="activeSection() === 'sobre-mi'"
        (click)="navigateTo('sobre-mi')"
      >
        Sobre Mí
      </button>
      <button
        type="button"
        class="top-nav__panel-link"
        [class.top-nav__panel-link--active]="activeSection() === 'proyectos'"
        (click)="navigateTo('proyectos')"
      >
        Proyectos
      </button>
      <button
        type="button"
        class="top-nav__panel-link top-nav__panel-link--contact"
        (click)="openContact()"
      >
        Contacto
      </button>
    </div>
  }
</nav>
